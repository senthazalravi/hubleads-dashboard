<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HubLeads — Nordic Startup Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            hub: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
            nordic: '#0f172a'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255,255,255,0.75); backdrop-filter: blur(16px); }
    .row-hover:hover { background: linear-gradient(90deg, #f8fafc 0%, #f1f5f9 100%); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-indigo-50/30 text-slate-800 min-h-screen">

  <header class="sticky top-0 z-40 glass border-b border-slate-200/60">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/25">
          <span class="text-white font-bold text-lg">H</span>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">HubLeads</h1>
          <p class="text-xs text-slate-500 -mt-0.5">Nordic Startup Intelligence</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-sm text-slate-500 hidden sm:inline" id="headerCount">Loading…</span>
        <button onclick="exportCSV()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm transition">
          <i class="fa-solid fa-download"></i> Export CSV
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm">
        <div class="text-3xl font-bold text-indigo-600" id="totalCount">—</div>
        <div class="text-sm text-slate-500 mt-1">Total Startups</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm">
        <div class="text-3xl font-bold text-emerald-600" id="withWebsite">—</div>
        <div class="text-sm text-slate-500 mt-1">With Website</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm">
        <div class="text-3xl font-bold text-amber-600" id="fundingCount">—</div>
        <div class="text-sm text-slate-500 mt-1">Series A+</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm">
        <div class="text-3xl font-bold text-sky-600" id="filteredCount">—</div>
        <div class="text-sm text-slate-500 mt-1">Matching Filters</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200/80 p-5 mb-6 shadow-sm">
      <div class="grid md:grid-cols-4 gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Search</label>
          <input type="text" id="search" placeholder="Name, industry, location…" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" oninput="filterData()">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Industry</label>
          <select id="industryFilter" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" onchange="filterData()">
            <option value="">All Industries</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Funding</label>
          <select id="fundingFilter" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" onchange="filterData()">
            <option value="">All Stages</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Country</label>
          <select id="countryFilter" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" onchange="filterData()">
            <option value="">All Countries</option>
          </select>
        </div>
      </div>
      <div class="mt-4 flex items-center justify-between">
        <button onclick="resetFilters()" class="text-sm text-slate-500 hover:text-slate-800 font-medium">Reset filters</button>
        <span class="text-sm text-slate-500" id="resultText">Loading startups…</span>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50/80 border-b border-slate-200">
            <tr>
              <th class="text-left px-5 py-3.5 font-semibold text-slate-600">Company</th>
              <th class="text-left px-5 py-3.5 font-semibold text-slate-600">Industry</th>
              <th class="text-left px-5 py-3.5 font-semibold text-slate-600">Location</th>
              <th class="text-left px-5 py-3.5 font-semibold text-slate-600">Size</th>
              <th class="text-left px-5 py-3.5 font-semibold text-slate-600">Funding</th>
              <th class="text-left px-5 py-3.5 font-semibold text-slate-600">Email</th>
              <th class="text-left px-5 py-3.5 font-semibold text-slate-600">Website</th>
              <th class="w-10"></th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="p-6 border-b border-slate-100 flex justify-between items-start">
        <h2 class="text-xl font-bold" id="modalTitle"></h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="p-6" id="modalContent"></div>
    </div>
  </div>

  <script>
    let startups = [];
    let filtered = [];

    async function loadData() {
      try {
        const res = await fetch('data.json');
        startups = await res.json();
        filtered = [...startups];
        init();
      } catch (e) {
        document.getElementById('resultText').textContent = 'Failed to load data';
        console.error(e);
      }
    }

    function init() {
      document.getElementById('totalCount').textContent = startups.length.toLocaleString();
      document.getElementById('headerCount').textContent = startups.length.toLocaleString() + ' startups';
      document.getElementById('withWebsite').textContent = startups.filter(s => s.website).length.toLocaleString();
      document.getElementById('fundingCount').textContent = startups.filter(s => (s.funding || '').includes('Series') || s.funding === 'Public').length.toLocaleString();
      populateFilters();
      renderTable();
    }

    function populateFilters() {
      const industries = [...new Set(startups.flatMap(s => (s.industries || '').split(',').map(i => i.trim()).filter(Boolean)))].sort();
      const funding = [...new Set(startups.map(s => s.funding).filter(Boolean))].sort();
      const countries = [...new Set(startups.map(s => s.location).filter(Boolean))].sort();

      const ind = document.getElementById('industryFilter');
      industries.forEach(i => ind.innerHTML += `<option value="${i}">${i}</option>`);
      const fund = document.getElementById('fundingFilter');
      funding.forEach(f => fund.innerHTML += `<option value="${f}">${f}</option>`);
      const country = document.getElementById('countryFilter');
      countries.forEach(c => country.innerHTML += `<option value="${c}">${c}</option>`);
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const show = filtered.slice(0, 300);
      tbody.innerHTML = show.map(s => `
        <tr class="row-hover cursor-pointer transition" onclick='showDetail(${JSON.stringify(s).replace(/'/g, "\\'")})'>
          <td class="px-5 py-3.5">
            <div class="font-semibold text-slate-900">${s.name || '—'}</div>
            <div class="text-xs text-slate-400 truncate max-w-xs">${(s.description || '').slice(0, 60)}…</div>
          </td>
          <td class="px-5 py-3.5 text-slate-600">${(s.industries || '').split(',')[0] || '—'}</td>
          <td class="px-5 py-3.5">${s.location || '—'}</td>
          <td class="px-5 py-3.5 text-slate-600">${s.employees || '—'}</td>
          <td class="px-5 py-3.5"><span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700">${s.funding || '—'}</span></td>
          <td class="px-5 py-3.5 text-xs">${s.email ? `<a href="mailto:${s.email}" class="text-indigo-600">${s.email}</a>` : '—'}</td>
          <td class="px-5 py-3.5">${s.website ? `<a href="${s.website}" target="_blank" onclick="event.stopPropagation()" class="text-indigo-600 hover:text-indigo-800 font-medium">Visit</a>` : '—'}</td>
          <td class="px-5 py-3.5 text-slate-300"><i class="fa-solid fa-chevron-right"></i></td>
        </tr>
      `).join('');
      document.getElementById('filteredCount').textContent = filtered.length.toLocaleString();
      document.getElementById('resultText').textContent = `Showing ${Math.min(show.length, filtered.length).toLocaleString()} of ${filtered.length.toLocaleString()} matching (${startups.length.toLocaleString()} total)`;
    }

    function filterData() {
      const q = document.getElementById('search').value.toLowerCase();
      const ind = document.getElementById('industryFilter').value;
      const fund = document.getElementById('fundingFilter').value;
      const country = document.getElementById('countryFilter').value;

      filtered = startups.filter(s => {
        const text = `${s.name} ${s.description} ${s.industries} ${s.location}`.toLowerCase();
        return (!q || text.includes(q)) &&
               (!ind || (s.industries || '').includes(ind)) &&
               (!fund || s.funding === fund) &&
               (!country || s.location === country);
      });
      renderTable();
    }

    function resetFilters() {
      document.getElementById('search').value = '';
      document.getElementById('industryFilter').value = '';
      document.getElementById('fundingFilter').value = '';
      document.getElementById('countryFilter').value = '';
      filtered = [...startups];
      renderTable();
    }

    function showDetail(s) {
      document.getElementById('modalTitle').textContent = s.name;
      document.getElementById('modalContent').innerHTML = `
        <p class="text-slate-600 leading-relaxed mb-5">${s.description || 'No description available.'}</p>
        <div class="grid grid-cols-2 gap-4 text-sm mb-5">
          <div><span class="text-slate-400">Email</span><div class="font-medium mt-0.5">${s.email ? `<a href="mailto:${s.email}" class="text-indigo-600">${s.email}</a>` : '—'}</div></div>
          <div><span class="text-slate-400">Phone</span><div class="font-medium mt-0.5">${s.phone || '—'}</div></div>
          <div><span class="text-slate-400">Website</span><div class="font-medium mt-0.5">${s.website ? `<a href="${s.website}" target="_blank" class="text-indigo-600">${s.website.replace('https://','')}</a>` : '—'}</div></div>
          <div><span class="text-slate-400">Location</span><div class="font-medium mt-0.5">${s.location || '—'}</div></div>
          <div><span class="text-slate-400">Founded</span><div class="font-medium mt-0.5">${s.founded || '—'}</div></div>
          <div><span class="text-slate-400">Employees</span><div class="font-medium mt-0.5">${s.employees || '—'}</div></div>
          <div><span class="text-slate-400">Business Model</span><div class="font-medium mt-0.5">${s.businessModel || '—'}</div></div>
          <div><span class="text-slate-400">Funding</span><div class="font-medium mt-0.5">${s.funding || '—'}</div></div>
        </div>
        <div class="mb-5">
          <div class="text-slate-400 text-sm mb-2">Industries</div>
          <div class="flex flex-wrap gap-2">${(s.industries || '').split(',').map(i => `<span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-medium">${i.trim()}</span>`).join('')}</div>
        </div>
        <div class="flex gap-3 pt-2">
          <a href="${s.hubUrl}" target="_blank" class="text-sm bg-slate-100 hover:bg-slate-200 px-4 py-2.5 rounded-xl font-medium transition">View on The Hub</a>
          <a href="mailto:${s.email || ''}?subject=${encodeURIComponent('Partnership with ' + s.name)}" class="text-sm bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-medium hover:bg-indigo-700 transition">Outreach Email</a>
        </div>
      `;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function exportCSV() {
      const headers = ['Name','Description','Website','Email','Phone','Location','Founded','Employees','Industries','Business Model','Funding','Hub URL'];
      const rows = filtered.map(s => [
        `"${(s.name||'').replace(/"/g,'""')}"`,
        `"${(s.description||'').replace(/"/g,'""')}"`,
        s.website || '', s.email || '', s.phone || '', s.location || '', s.founded || '', s.employees || '',
        `"${(s.industries||'').replace(/"/g,'""')}"`,
        s.businessModel || '', s.funding || '', s.hubUrl || ''
      ]);
      const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `hubleads-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    loadData();
  </script>
</body>
</html>
