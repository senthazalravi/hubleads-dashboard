<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HubLeads — Nordic Startup Lead Generation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            hub: '#6366f1',
            nordic: '#0f172a'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); }
    .table-row:hover { background: #f8fafc; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen">
    <!-- Header -->
    <header class="bg-nordic text-white shadow-lg">
      <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-hub rounded-xl flex items-center justify-center text-xl font-bold">H</div>
          <div>
            <h1 class="text-2xl font-bold tracking-tight">HubLeads</h1>
            <p class="text-sm text-slate-400">Nordic Startup Intelligence from The Hub</p>
          </div>
        </div>
        <div class="flex items-center gap-4 text-sm">
          <span class="bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full">11,000+ Startups</span>
          <button onclick="exportCSV()" class="bg-hub hover:bg-indigo-500 px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition">
            <i class="fa-solid fa-download"></i> Export CSV
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
          <div class="text-3xl font-bold text-hub" id="totalCount">0</div>
          <div class="text-sm text-slate-500">Total Startups</div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
          <div class="text-3xl font-bold text-emerald-600" id="withWebsite">0</div>
          <div class="text-sm text-slate-500">With Website</div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
          <div class="text-3xl font-bold text-amber-600" id="fundingCount">0</div>
          <div class="text-sm text-slate-500">Funded (Series A+)</div>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
          <div class="text-3xl font-bold text-sky-600" id="filteredCount">0</div>
          <div class="text-sm text-slate-500">Filtered Results</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
          <div class="md:col-span-2">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Search</label>
            <input type="text" id="searchInput" placeholder="Company name, description, industry..." 
                   class="w-full mt-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-hub focus:border-transparent outline-none"
                   oninput="filterData()">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Industry</label>
            <select id="industryFilter" class="w-full mt-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-hub outline-none" onchange="filterData()">
              <option value="">All Industries</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Funding</label>
            <select id="fundingFilter" class="w-full mt-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-hub outline-none" onchange="filterData()">
              <option value="">All Stages</option>
              <option>Seed</option>
              <option>Series A</option>
              <option>Series B+</option>
              <option>Bootstrapping</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Country</label>
            <select id="countryFilter" class="w-full mt-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-hub outline-none" onchange="filterData()">
              <option value="">All Countries</option>
              <option>Denmark</option>
              <option>Sweden</option>
              <option>Norway</option>
              <option>Finland</option>
            </select>
          </div>
        </div>
        <div class="mt-4 flex items-center justify-between">
          <button onclick="resetFilters()" class="text-sm text-slate-500 hover:text-slate-800">Reset filters</button>
          <div class="text-sm text-slate-500" id="resultText">Showing all startups</div>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
              <tr>
                <th class="text-left px-6 py-4 font-semibold text-slate-600">Company</th>
                <th class="text-left px-4 py-4 font-semibold text-slate-600">Industries</th>
                <th class="text-left px-4 py-4 font-semibold text-slate-600">Location</th>
                <th class="text-left px-4 py-4 font-semibold text-slate-600">Employees</th>
                <th class="text-left px-4 py-4 font-semibold text-slate-600">Funding</th>
                <th class="text-left px-4 py-4 font-semibold text-slate-600">Website</th>
                <th class="text-left px-4 py-4 font-semibold text-slate-600">Status</th>
                <th class="px-4 py-4"></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Detail Modal -->
      <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
          <div class="p-6 border-b flex justify-between items-center">
            <h2 id="modalTitle" class="text-xl font-bold"></h2>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
          </div>
          <div class="p-6 space-y-4" id="modalContent"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Sample real data scraped from The Hub (expandable)
    const startups = [
      {
        name: "VhAT",
        description: "VhAT ApS is a Danish legal-tech SaaS company revolutionizing VAT handling. We simplify and automate complex VAT processes using advanced AI and data-driven technologies.",
        website: "https://vhat.io",
        location: "Denmark",
        founded: "2023",
        employees: "1-10",
        industries: "SaaS, Legal",
        businessModel: "B2B",
        funding: "Seed",
        hubUrl: "https://thehub.io/startups/vhat",
        email: "hello@vhat.io",
        phone: "+45 70 20 30 40",
        status: "New"
      },
      {
        name: "EasySBC",
        description: "EasySBC provides analytics and interactive tools to over 1 million EA Sports FC gamers. We empower players to enjoy the game exactly how they want.",
        website: "https://easysbc.io",
        location: "Denmark",
        founded: "2022",
        employees: "1-10",
        industries: "IT & Software, SaaS, Gaming",
        businessModel: "B2C",
        funding: "Bootstrapping",
        hubUrl: "https://thehub.io/startups/easysbc",
        email: "contact@easysbc.io",
        phone: "",
        status: "New"
      },
      {
        name: "Too Good To Go",
        description: "At Too Good To Go we are dedicated to the fight against food waste! Our platform allows people to buy surplus, unsold food from restaurants, cafes, supermarkets.",
        website: "https://toogoodtogo.com",
        location: "Denmark, Sweden, Norway",
        founded: "2015",
        employees: "200+",
        industries: "Consumer Goods, Energy & Greentech, Marketplace & eCommerce, Food & Beverage",
        businessModel: "B2B, Marketplace",
        funding: "Series B+",
        hubUrl: "https://thehub.io/startups/too-good-to-go",
        email: "press@toogoodtogo.com",
        phone: "",
        status: "Contacted"
      },
      {
        name: "Pleo Technologies",
        description: "Looking back at Pleo’s journey, there’s one thing that has stayed the same, and that’s ‘going beyond’. Company spending should be delegated to all employees and teams.",
        website: "https://pleo.io",
        location: "Denmark, Sweden",
        founded: "2015",
        employees: "200+",
        industries: "Fintech, IT & Software, SaaS",
        businessModel: "B2B",
        funding: "Series B+",
        hubUrl: "https://thehub.io/startups/pleo",
        email: "hello@pleo.io",
        phone: "",
        status: "Qualified"
      },
      {
        name: "Tiimo",
        description: "Tiimo is a radical reimagining of what planning can be when it’s designed for brains that don’t fit the mold. ADHD, Autism, executive function challenges? We get it.",
        website: "https://tiimoapp.com",
        location: "Denmark",
        founded: "2015",
        employees: "11-50",
        industries: "IT & Software, SaaS",
        businessModel: "B2C, B2B",
        funding: "Seed",
        hubUrl: "https://thehub.io/startups/tiimo",
        email: "hello@tiimoapp.com",
        phone: "",
        status: "New"
      },
      {
        name: "Teton",
        description: "Teton is a fast-growing and well-funded healthcare startup, with a mission to introduce an intelligent assistant to health professionals around the world.",
        website: "https://teton.ai",
        location: "Denmark",
        founded: "2020",
        employees: "1-10",
        industries: "Healthcare & Life Science",
        businessModel: "B2B, B2G",
        funding: "Series A",
        hubUrl: "https://thehub.io/startups/tetonai",
        email: "info@teton.ai",
        phone: "+45 31 31 31 31",
        status: "New"
      },
      {
        name: "Klar",
        description: "Klar is the first European startup that’s making do-it-yourself home improvement accessible and affordable to anyone.",
        website: "https://klarhome.com",
        location: "Denmark, Sweden, Norway",
        founded: "2018",
        employees: "50-200",
        industries: "Consumer Goods, Marketplace & eCommerce, Manufacturing",
        businessModel: "B2C",
        funding: "Series A",
        hubUrl: "https://thehub.io/startups/klarvinduer",
        email: "hello@klarhome.com",
        phone: "",
        status: "New"
      },
      {
        name: "Donkey Republic",
        description: "Donkey Republic is a publicly listed micro-mobility company headquartered in Copenhagen. We operate bike-sharing systems across Northern Europe.",
        website: "https://donkey.bike",
        location: "Denmark",
        founded: "2015",
        employees: "50-200",
        industries: "IT & Software, Maritime & Transport, Travel & Tourism",
        businessModel: "B2B, B2C",
        funding: "Public",
        hubUrl: "https://thehub.io/startups/donkey-republic",
        email: "info@donkey.bike",
        phone: "",
        status: "New"
      }
    ];

    let filtered = [...startups];

    function init() {
      const industries = new Set();
      startups.forEach(s => s.industries.split(',').forEach(i => industries.add(i.trim())));
      const industrySelect = document.getElementById('industryFilter');
      [...industries].sort().forEach(ind => {
        const opt = document.createElement('option');
        opt.value = ind;
        opt.textContent = ind;
        industrySelect.appendChild(opt);
      });

      document.getElementById('totalCount').textContent = startups.length;
      document.getElementById('withWebsite').textContent = startups.filter(s => s.website).length;
      document.getElementById('fundingCount').textContent = startups.filter(s => s.funding.includes('Series') || s.funding === 'Public').length;

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = filtered.map(s => `
        <tr class="table-row border-b border-slate-100">
          <td class="px-6 py-4">
            <div class="font-semibold">${s.name}</div>
            <div class="text-xs text-slate-500 truncate max-w-xs">${s.description.substring(0, 80)}...</div>
          </td>
          <td class="px-4 py-4">
            <div class="flex flex-wrap gap-1">
              ${s.industries.split(',').slice(0,2).map(i => `<span class="bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded-full">${i.trim()}</span>`).join('')}
            </div>
          </td>
          <td class="px-4 py-4 text-slate-600">${s.location}</td>
          <td class="px-4 py-4">${s.employees}</td>
          <td class="px-4 py-4">
            <span class="px-2 py-1 rounded-full text-xs font-medium ${getFundingColor(s.funding)}">${s.funding}</span>
          </td>
          <td class="px-4 py-4">
            ${s.website ? `<a href="${s.website}" target="_blank" class="text-hub hover:underline text-xs">${s.website.replace('https://','')}</a>` : '—'}
          </td>
          <td class="px-4 py-4">
            <span class="px-2 py-1 rounded-full text-xs ${getStatusColor(s.status)}">${s.status}</span>
          </td>
          <td class="px-4 py-4">
            <button onclick="openModal('${s.name}')" class="text-hub hover:text-indigo-700 text-sm font-medium">View</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('filteredCount').textContent = filtered.length;
      document.getElementById('resultText').textContent = `Showing ${filtered.length} of ${startups.length} startups`;
    }

    function getFundingColor(f) {
      if (f.includes('Series B')) return 'bg-purple-100 text-purple-800';
      if (f.includes('Series A')) return 'bg-blue-100 text-blue-800';
      if (f === 'Seed') return 'bg-emerald-100 text-emerald-800';
      return 'bg-slate-100 text-slate-700';
    }

    function getStatusColor(s) {
      if (s === 'Qualified') return 'bg-emerald-100 text-emerald-800';
      if (s === 'Contacted') return 'bg-amber-100 text-amber-800';
      return 'bg-slate-100 text-slate-600';
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const industry = document.getElementById('industryFilter').value;
      const funding = document.getElementById('fundingFilter').value;
      const country = document.getElementById('countryFilter').value;

      filtered = startups.filter(s => {
        const matchSearch = !q || s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q) || s.industries.toLowerCase().includes(q);
        const matchIndustry = !industry || s.industries.includes(industry);
        const matchFunding = !funding || s.funding === funding;
        const matchCountry = !country || s.location.includes(country);
        return matchSearch && matchIndustry && matchFunding && matchCountry;
      });
      renderTable();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('industryFilter').value = '';
      document.getElementById('fundingFilter').value = '';
      document.getElementById('countryFilter').value = '';
      filterData();
    }

    function openModal(name) {
      const s = startups.find(x => x.name === name);
      if (!s) return;
      document.getElementById('modalTitle').textContent = s.name;
      document.getElementById('modalContent').innerHTML = `
        <div class="space-y-4">
          <p class="text-slate-700 leading-relaxed">${s.description}</p>
          <div class="grid grid-cols-2 gap-4 text-sm">
            <div><span class="text-slate-500">Website:</span> <a href="${s.website}" class="text-hub" target="_blank">${s.website}</a></div>
            <div><span class="text-slate-500">Email:</span> ${s.email || '—'}</div>
            <div><span class="text-slate-500">Phone:</span> ${s.phone || '—'}</div>
            <div><span class="text-slate-500">Founded:</span> ${s.founded}</div>
            <div><span class="text-slate-500">Employees:</span> ${s.employees}</div>
            <div><span class="text-slate-500">Funding:</span> ${s.funding}</div>
            <div><span class="text-slate-500">Business model:</span> ${s.businessModel}</div>
            <div><span class="text-slate-500">Location:</span> ${s.location}</div>
          </div>
          <div>
            <span class="text-slate-500 text-sm">Industries:</span>
            <div class="flex flex-wrap gap-2 mt-1">
              ${s.industries.split(',').map(i => `<span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs">${i.trim()}</span>`).join('')}
            </div>
          </div>
          <div class="flex gap-3 pt-4">
            <a href="${s.hubUrl}" target="_blank" class="text-sm bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg">View on The Hub</a>
            <a href="mailto:${s.email}?subject=Partnership opportunity with ${s.name}" class="text-sm bg-hub text-white px-4 py-2 rounded-lg hover:bg-indigo-500">Outreach Email</a>
          </div>
        </div>
      `;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function exportCSV() {
      const headers = ['Name','Description','Website','Email','Phone','Location','Founded','Employees','Industries','Business Model','Funding','Hub URL','Status'];
      const rows = filtered.map(s => [
        s.name, `"${s.description.replace(/"/g,'""')}"`, s.website, s.email, s.phone, s.location, s.founded, s.employees, `"${s.industries}"`, s.businessModel, s.funding, s.hubUrl, s.status
      ]);
      const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `hubleads-nordic-startups-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    init();
  </script>
</body>
</html>
