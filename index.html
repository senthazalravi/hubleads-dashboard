<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HubLeads — Nordic Startup Lead Generation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            hub: '#6366f1',
            nordic: '#0f172a'
          }
        }
      }
    }
  </script>
  <style>
    .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="min-h-screen">
    <header class="bg-white border-b sticky top-0 z-10 glass">
      <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-hub rounded-xl flex items-center justify-center text-white font-bold">H</div>
          <div>
            <h1 class="text-xl font-bold">HubLeads</h1>
            <p class="text-xs text-slate-500">Nordic Startup Intelligence from The Hub</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-sm font-medium text-slate-600" id="headerCount">875 Startups Loaded</span>
          <button onclick="exportCSV()" class="bg-hub text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-500">Export CSV</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white p-5 rounded-2xl border">
          <div class="text-3xl font-bold text-hub" id="totalCount">0</div>
          <div class="text-sm text-slate-500">Total Startups</div>
        </div>
        <div class="bg-white p-5 rounded-2xl border">
          <div class="text-3xl font-bold text-emerald-600" id="withWebsite">0</div>
          <div class="text-sm text-slate-500">With Website</div>
        </div>
        <div class="bg-white p-5 rounded-2xl border">
          <div class="text-3xl font-bold text-amber-600" id="fundingCount">0</div>
          <div class="text-sm text-slate-500">Funded (Series A+)</div>
        </div>
        <div class="bg-white p-5 rounded-2xl border">
          <div class="text-3xl font-bold text-sky-600" id="filteredCount">0</div>
          <div class="text-sm text-slate-500">Filtered Results</div>
        </div>
      </div>

      <div class="bg-white rounded-2xl border p-5 mb-6">
        <div class="grid md:grid-cols-4 gap-4">
          <div>
            <label class="text-xs font-medium text-slate-500">Search</label>
            <input type="text" id="search" placeholder="Company, industry, location..." class="w-full mt-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-hub outline-none" oninput="filterData()">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">Industry</label>
            <select id="industryFilter" class="w-full mt-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-hub outline-none" onchange="filterData()">
              <option value="">All Industries</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">Funding</label>
            <select id="fundingFilter" class="w-full mt-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-hub outline-none" onchange="filterData()">
              <option value="">All Funding</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">Country</label>
            <select id="countryFilter" class="w-full mt-1 px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-hub outline-none" onchange="filterData()">
              <option value="">All Countries</option>
            </select>
          </div>
        </div>
        <div class="mt-4 flex justify-between items-center">
          <button onclick="resetFilters()" class="text-sm text-slate-500 hover:text-slate-800">Reset filters</button>
          <span class="text-sm text-slate-500" id="resultText">Loading...</span>
        </div>
      </div>

      <div class="bg-white rounded-2xl border overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b">
              <tr>
                <th class="text-left px-4 py-3 font-medium">Company</th>
                <th class="text-left px-4 py-3 font-medium">Industries</th>
                <th class="text-left px-4 py-3 font-medium">Location</th>
                <th class="text-left px-4 py-3 font-medium">Employees</th>
                <th class="text-left px-4 py-3 font-medium">Funding</th>
                <th class="text-left px-4 py-3 font-medium">Website</th>
                <th class="text-left px-4 py-3 font-medium">Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
      <div class="flex justify-between items-start mb-4">
        <h2 class="text-xl font-bold" id="modalTitle"></h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    let startups = [];
    let filtered = [];

    async function loadData() {
      try {
        const res = await fetch('data.json');
        startups = await res.json();
        filtered = [...startups];
        init();
      } catch(e) {
        console.error(e);
        document.getElementById('resultText').textContent = 'Failed to load data: ' + e.message;
      }
    }

    function init() {
      document.getElementById('totalCount').textContent = startups.length;
      document.getElementById('withWebsite').textContent = startups.filter(s => s.website).length;
      document.getElementById('fundingCount').textContent = startups.filter(s => (s.funding||'').includes('Series') || s.funding === 'Public').length;
      populateFilters();
      renderTable();
    }

    function populateFilters() {
      const industries = [...new Set(startups.flatMap(s => (s.industries||'').split(',').map(i => i.trim()).filter(Boolean)))].sort();
      const funding = [...new Set(startups.map(s => s.funding).filter(Boolean))].sort();
      const countries = [...new Set(startups.map(s => s.location).filter(Boolean))].sort();

      const indSel = document.getElementById('industryFilter');
      industries.forEach(i => indSel.innerHTML += `<option value="${i}">${i}</option>`);

      const fundSel = document.getElementById('fundingFilter');
      funding.forEach(f => fundSel.innerHTML += `<option value="${f}">${f}</option>`);

      const countrySel = document.getElementById('countryFilter');
      countries.forEach(c => countrySel.innerHTML += `<option value="${c}">${c}</option>`);
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = filtered.slice(0, 200).map(s => `
        <tr class="border-b hover:bg-slate-50 cursor-pointer" onclick='showDetail(${JSON.stringify(s).replace(/'/g, "\\'")})'>
          <td class="px-4 py-3 font-medium">${s.name || ''}</td>
          <td class="px-4 py-3 text-xs">${(s.industries||'').split(',')[0] || ''}</td>
          <td class="px-4 py-3">${s.location || ''}</td>
          <td class="px-4 py-3">${s.employees || ''}</td>
          <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs bg-slate-100">${s.funding || ''}</span></td>
          <td class="px-4 py-3">${s.website ? `<a href="${s.website}" target="_blank" class="text-hub hover:underline" onclick="event.stopPropagation()">Visit</a>` : ''}</td>
          <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs bg-indigo-50 text-indigo-700">${s.status || 'New'}</span></td>
          <td class="px-4 py-3"><i class="fa-solid fa-chevron-right text-slate-300"></i></td>
        </tr>
      `).join('');
      document.getElementById('filteredCount').textContent = filtered.length;
      document.getElementById('resultText').textContent = `Showing ${Math.min(filtered.length,200)} of ${filtered.length} (total ${startups.length})`;
    }

    function filterData() {
      const q = document.getElementById('search').value.toLowerCase();
      const ind = document.getElementById('industryFilter').value;
      const fund = document.getElementById('fundingFilter').value;
      const country = document.getElementById('countryFilter').value;

      filtered = startups.filter(s => {
        const text = `${s.name} ${s.description} ${s.industries} ${s.location}`.toLowerCase();
        return (!q || text.includes(q)) &&
               (!ind || (s.industries||'').includes(ind)) &&
               (!fund || s.funding === fund) &&
               (!country || s.location === country);
      });
      renderTable();
    }

    function resetFilters() {
      document.getElementById('search').value = '';
      document.getElementById('industryFilter').value = '';
      document.getElementById('fundingFilter').value = '';
      document.getElementById('countryFilter').value = '';
      filtered = [...startups];
      renderTable();
    }

    function showDetail(s) {
      document.getElementById('modalTitle').textContent = s.name;
      document.getElementById('modalContent').innerHTML = `
        <p class="text-slate-600 mb-4">${s.description || ''}</p>
        <div class="grid grid-cols-2 gap-3 text-sm mb-4">
          <div><span class="text-slate-500">Website:</span> ${s.website ? `<a href="${s.website}" target="_blank" class="text-hub">${s.website}</a>` : 'N/A'}</div>
          <div><span class="text-slate-500">Location:</span> ${s.location || ''}</div>
          <div><span class="text-slate-500">Founded:</span> ${s.founded || ''}</div>
          <div><span class="text-slate-500">Employees:</span> ${s.employees || ''}</div>
          <div><span class="text-slate-500">Business Model:</span> ${s.businessModel || ''}</div>
          <div><span class="text-slate-500">Funding:</span> ${s.funding || ''}</div>
        </div>
        <div>
          <span class="text-slate-500 text-sm">Industries:</span>
          <div class="flex flex-wrap gap-2 mt-1">
            ${(s.industries||'').split(',').map(i => `<span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs">${i.trim()}</span>`).join('')}
          </div>
        </div>
        <div class="flex gap-3 pt-4">
          <a href="${s.hubUrl}" target="_blank" class="text-sm bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg">View on The Hub</a>
          <a href="mailto:?subject=Partnership opportunity with ${encodeURIComponent(s.name)}" class="text-sm bg-hub text-white px-4 py-2 rounded-lg hover:bg-indigo-500">Outreach Email</a>
        </div>
      `;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function exportCSV() {
      const headers = ['Name','Description','Website','Location','Founded','Employees','Industries','Business Model','Funding','Hub URL','Status'];
      const rows = filtered.map(s => [
        s.name, `"${(s.description||'').replace(/"/g,'""')}"`, s.website, s.location, s.founded, s.employees, `"${s.industries||''}"`, s.businessModel, s.funding, s.hubUrl, s.status
      ]);
      const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `hubleads-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    loadData();
  </script>
</body>
</html>
